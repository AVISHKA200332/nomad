<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b36"/>
      <stop offset="100%" stop-color="#031126"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0090ea"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2.5"/>
  
  <!-- Signature Top Red / Coral Accent Bar -->
  <rect x="11.5" y="11.5" width="18" height="4.5" rx="1.5" fill="#FF4B4B"/>
  
  <!-- Accent Blue Dot -->
  <circle cx="47" cy="14" r="3" fill="#0090EA"/>

  <!-- Bold Modern Nomad 'N' Mark -->
  <!-- Left Pillar -->
  <path d="M14 22 L11.5 24.5 V50 H23 V33.5 Z" fill="#FFFFFF"/>
  <rect x="14" y="22" width="9" height="28" fill="#FFFFFF"/>
  <!-- Right Pillar -->
  <rect x="41" y="22" width="9" height="28" fill="#FFFFFF"/>
  <!-- White Diagonal Upper -->
  <polygon points="14,22 28,33.5 28,38.5 23,33.5 14,24.5" fill="#FFFFFF"/>
  <polygon points="14,22 35.5,38 35.5,33.5 23,22" fill="#FFFFFF"/>
  <!-- Vibrant Blue Diagonal Lower -->
  <polygon points="28,33.5 41,43.5 50,50 41,50 28,38.5" fill="url(#blueGrad)"/>
</svg>
